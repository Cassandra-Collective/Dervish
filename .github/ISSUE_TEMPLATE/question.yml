name: Question
description: Ask about the optimizer, the evaluation record or how to use Dervish.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The answer may already be written down: the README, `docs/DESIGN.md` (the algorithm and its proofs), `docs/RESULTS.md` (every measurement) and `docs/PRIOR_ART.md` (what is and is not new). The [support page](https://github.com/Cassandra-Collective/.github/blob/main/SUPPORT.md) lists other ways to get help.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What you are trying to do, and what you have read or tried so far.
  - type: input
    id: environment
    attributes:
      label: Environment, if it matters
      description: Python and PyTorch versions, operating system, device.
